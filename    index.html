<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovA - متجر الأناقة السوداني</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#fff0f5;color:#222}
header{background:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px #0001;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:26px;color:#e91e63;letter-spacing:1px}
.hero{text-align:center;padding:65px 20px;background:linear-gradient(135deg,#ff2e78,#ff8eb3);color:#fff}
.hero h1{margin:0 0 10px;font-size:32px}
.hero p{opacity:.9}
.btn{margin-top:18px;background:#111;color:#fff;padding:12px 28px;border-radius:30px;border:0;font-size:16px}
.products{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 6px 18px #0001;text-align:center;padding-bottom:10px}
.card img{width:100%;height:150px;object-fit:cover}
.card h3{font-size:14px;margin:10px 6px 4px}
.card p{margin:0;color:#e91e63;font-weight:700}
.card button{margin-top:8px;background:#e91e63;color:#fff;border:0;padding:9px 14px;border-radius:20px;width:90%}
footer{text-align:center;padding:22px;color:#aaa;font-size:13px}
</style>
</head>
<body>
<header><div class="logo">NovA</div><div>🛍️</div></header>
<div class="hero">
<h1>أناقتك تبدأ من NovA</h1>
<p>أجمل تشكيلات الملابس النسائية والأكسسوارات - توصيل لكل السودان</p>
<button class="btn" onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">تسوقي الآن</button>
</div>
<div id="shop" class="products">
<div class="card"><img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500"><h3>تيشيرت NovA كاجوال</h3><p>15,000 SDG</p><button onclick="order('تيشيرت NovA كاجوال')">اطلبي واتساب</button></div>
<div class="card"><img src="https://images.unsplash.com/photo-1515372039744-875a22a9c0d9?w=500"><h3>فستان صيفي أنيق</h3><p>25,000 SDG</p><button onclick="order('فستان صيفي')">اطلبي واتساب</button></div>
<div class="card"><img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"><h3>حذاء رياضي NovA</h3><p>18,000 SDG</p><button onclick="order('حذاء رياضي')">اطلبي واتساب</button></div>
<div class="card"><img src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=500"><h3>شنطة يد فاخرة</h3><p>22,000 SDG</p><button onclick="order('شنطة يد')">اطلبي واتساب</button></div>
</div>
<footer>© 2026 NovA Store - toonamohamed55-web.github.io<br>صنع بحب في السودان</footer>
<script>
function order(p){window.open('https://wa.me/249999999999?text=مرحبا NovA عايزة اطلب: '+encodeURIComponent(p),'_blank')}
</script>
</body>
</html>
